[workspace]
members = [
    "origin",
    "origin-common",
    "origin-identity",
    "origin-pass",
    "origin-seal",
    "origin-seed",
    "origin-shard",
    "origin-proof",
    "origin-stealth",
    "origin-entropy",
    "origin-schnorr",
    "origin-channel",
    "origin-provenance",
    "origin-attest",
    "origin-secrets",
    "origin-memory",
    "origin-cross-tests",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.4.3"
edition = "2021"
license = "Apache-2.0"
authors = ["Origin SDK Contributors"]

[workspace.dependencies]
# The sibling SDK is the authoritative crypto provider. Keep the exact version
# constraint so origin-tools cannot silently build against another SDK release.
# Uses crates.io for CI; for local development with a sibling checkout, add a
# [patch.crates-io] section at the bottom of this file:
#   [patch.crates-io]
#   origin-crypto-sdk = { path = "../origin-crypto-sdk" }
origin-crypto-sdk = "=0.7.1-rc.4"
origin-common = { path = "origin-common" }
origin-identity = { path = "origin-identity" }
origin-pass = { path = "origin-pass" }
origin-seal = { path = "origin-seal" }
origin-seed = { path = "origin-seed" }
origin-shard = { path = "origin-shard" }
origin-proof = { path = "origin-proof" }
origin-stealth = { path = "origin-stealth" }
origin-entropy = { path = "origin-entropy" }
origin-schnorr = { path = "origin-schnorr" }
origin-channel = { path = "origin-channel" }
origin-provenance = { path = "origin-provenance" }
origin-attest = { path = "origin-attest" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rpassword = "7"
ed25519-dalek = "2"

# Local sibling SDK checkpoint for development. Comment out to use crates.io.
[patch.crates-io]
origin-crypto-sdk = { path = "../origin-crypto-sdk" }

# Optimize dependencies (Falcon-1024, ed25519-dalek, etc.) in dev builds.
# Without this, PQC polynomial arithmetic runs ~10x slower at opt-level 0,
# making sign/verify integration tests take 60s+ instead of ~6s.
# Workspace crates stay at opt-level 0 for fast incremental compilation.
[profile.dev.package."*"]
opt-level = 2
