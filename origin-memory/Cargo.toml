[package]
name = "origin-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Provenance-tagged, temporally-aware, orthogonally-layered memory graph for humans and AI"

[dependencies]
origin-common = { path = "../origin-common" }
origin-provenance = { path = "../origin-provenance" }
origin-proof = { path = "../origin-proof" }
origin-crypto-sdk.workspace = true
serde.workspace = true
serde_json = "1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
