# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout origin-tools
        uses: actions/checkout@v4
        with:
          path: origin-tools

      - name: Checkout origin-crypto-sdk
        uses: actions/checkout@v4
        with:
          repository: KidIkaros/OriginSDK
          path: origin-crypto-sdk

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            origin-tools/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('origin-tools/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build all binaries
        # Integration tests (e.g. origin-proof) spawn sibling origin-* binaries.
        # Build them first so `cargo test` never races to run a test before its
        # sibling binary exists.
        run: cargo build --workspace --bins
        working-directory: origin-tools

      - name: Run tests
        # `timeout` fails the job if the suite hangs (e.g. a spawned sibling
        # binary spinning) instead of burning CI minutes indefinitely.
        run: timeout 600 cargo test --workspace
        working-directory: origin-tools

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout origin-tools
        uses: actions/checkout@v4
        with:
          path: origin-tools

      - name: Checkout origin-crypto-sdk
        uses: actions/checkout@v4
        with:
          repository: KidIkaros/OriginSDK
          path: origin-crypto-sdk

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            origin-tools/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('origin-tools/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-

      - name: Run clippy (origin-secrets, deny warnings)
        run: cargo clippy -p origin-secrets --all-targets -- -D warnings
        working-directory: origin-tools

      - name: Run clippy (workspace, visibility only)
        run: cargo clippy --workspace --all-targets
        working-directory: origin-tools

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout origin-tools
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
