# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout origin-tools
        uses: actions/checkout@v4
        with:
          path: origin-tools

      - name: Checkout origin-crypto-sdk
        uses: actions/checkout@v4
        with:
          repository: KidIkaros/OriginSDK
          path: origin-crypto-sdk

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            origin-tools/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('origin-tools/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --workspace
        working-directory: origin-tools

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout origin-tools
        uses: actions/checkout@v4
        with:
          path: origin-tools

      - name: Checkout origin-crypto-sdk
        uses: actions/checkout@v4
        with:
          repository: KidIkaros/OriginSDK
          path: origin-crypto-sdk

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            origin-tools/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('origin-tools/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: origin-tools

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout origin-tools
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
