[package]
name = "origin-channel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Encrypted sessions — Noise handshake, double ratchet, AEAD messaging"

[dependencies]
origin-common = { path = "../origin-common" }
origin-crypto-sdk.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
zeroize = { version = "1", features = ["derive"] }
subtle = "2.5"
getrandom = "0.3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
