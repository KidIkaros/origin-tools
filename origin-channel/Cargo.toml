[package]
name = "origin-channel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Encrypted sessions — Noise handshake, double ratchet, AEAD messaging"

[dependencies]
origin-common = { path = "../origin-common" }
origin-crypto-sdk.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
# X25519/Ed25519 come from origin-crypto-sdk 0.7.1-rc.10; no direct dalek dependency.
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
