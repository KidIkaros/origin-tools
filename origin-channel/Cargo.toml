[package]
name = "origin-channel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Encrypted sessions — Noise handshake, double ratchet, AEAD messaging"

[dependencies]
origin-common = { path = "../origin-common" }
origin-crypto-sdk.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
# X25519 now comes from origin-crypto-sdk (>= 0.7.1-rc.7); no direct dalek dependency.
ed25519-dalek = "2"
zeroize = { version = "1", features = ["derive"] }
subtle = "2.5"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
