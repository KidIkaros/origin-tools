[package]
name = "origin-canary"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Origin SDK Contributors"]
description = "Origin Canary Embedder — steganographic canary token embedding for source-available / fair-source projects"

[dependencies]
origin-crypto-sdk = { version = "0.7.1-rc.5", features = [] }
ed25519-dalek.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
rpassword.workspace = true

[dev-dependencies]
tempfile = "3"

[lib]
name = "origin_canary"
path = "src/lib.rs"

[[bin]]
name = "origin-canary"
path = "src/bin.rs"
