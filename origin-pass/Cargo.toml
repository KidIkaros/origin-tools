[package]
name = "origin-pass"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Encrypted password vault + 2FA authenticator (TOTP/HOTP) built on origin-crypto-sdk"
readme = "README.md"

[[bin]]
name = "origin-pass"
path = "src/main.rs"

[dependencies]
origin-common = { path = "../origin-common" }
origin-crypto-sdk = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
rpassword = { workspace = true }
zeroize = "1"
# `qrcode` 0.14 — terminal block-character QR rendering for
# `cmd_export_qr`. The crate's `render::unicode::Dense1x2` produces
# half-block ▀▄█ characters that modern phone cameras scan reliably
# through phone-camera apps (Google Authenticator, etc.). No PNG
# dependency tree pulled in (text-only mode = no `image`/`png`).
qrcode = "0.14"

# base32 encoding for otpauth:// URI generation reuses the SDK's
# `origin_crypto_sdk::drbg::otp::base32_encode` is provided by the pinned
# origin-crypto-sdk 0.7.1-rc.2 sibling dependency. No crate-local base32 dependency
# is needed.

[dev-dependencies]
tempfile = "3"
